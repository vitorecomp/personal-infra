# Taiga stack for the GCP VM (taiga.vitorx86.dev).
#
# TLS and ports are handled by the shared edge stack (cloud/edge); this stack publishes nothing
# and joins the `edge` network as `taiga-app`. The database is managed Postgres on Neon (TLS),
# configured through TAIGA_DB_* in /opt/stacks/taiga/.env (synced from the taiga-prod GitHub
# environment by the deploy workflow). The image is built on the VM from ./Dockerfile.
#
# Rules: every volume has an explicit name; never run `docker compose down -v`.
name: taiga

services:
  taiga:
    build:
      context: .
      dockerfile: Dockerfile
    image: taiga:local
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${TAIGA_DB_HOST:?set TAIGA_DB_HOST in .env}
      POSTGRES_PORT: ${TAIGA_DB_PORT:-5432}
      POSTGRES_DB: ${TAIGA_DB_NAME:-taiga}
      POSTGRES_USER: ${TAIGA_DB_USER:?set TAIGA_DB_USER in .env}
      POSTGRES_PASSWORD: ${TAIGA_DB_PASSWORD:?set TAIGA_DB_PASSWORD in .env}
      # Neon requires TLS. Taiga's settings pass sslmode explicitly from POSTGRES_SSLMODE
      # (default "disable"), which overrides libpq's PGSSLMODE, so set both.
      POSTGRES_SSLMODE: ${TAIGA_DB_SSLMODE:-require}
      PGSSLMODE: ${TAIGA_DB_SSLMODE:-require}
      TAIGA_SECRET_KEY: ${TAIGA_SECRET_KEY:?set TAIGA_SECRET_KEY in .env}
      TAIGA_SITES_SCHEME: https
      TAIGA_SITES_DOMAIN: ${STACK_DOMAIN:-taiga.vitorx86.dev}
      TAIGA_URL: https://${STACK_DOMAIN:-taiga.vitorx86.dev}
      PUBLIC_REGISTER_ENABLED: "False"
      ENABLE_TELEMETRY: "False"
      CELERY_ENABLED: "False"
      TAIGA_ADMIN_USER: ${TAIGA_ADMIN_USER:-admin}
      TAIGA_ADMIN_EMAIL: ${TAIGA_ADMIN_EMAIL:-vitor.ecomp@gmail.com}
      TAIGA_ADMIN_PASSWORD: ${TAIGA_ADMIN_PASSWORD:-}
      TAIGA_STORAGE_SYNC_DIR: /mnt/taiga-storage
      # e2-micro shares 1 GB RAM with Ghost + MySQL: one worker keeps gunicorn small.
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
    volumes:
      - taiga-media:/mnt/taiga-storage
    networks:
      default:
      edge:
        aliases: [taiga-app]
    healthcheck:
      # Static file served by the container's nginx (only up after migrations finished).
      # Deliberately does NOT touch the database: a DB health check every 30 s would keep
      # Neon's compute awake 24/7 and burn the free 100 CU-hours/month in ~2 weeks.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/conf.json', timeout=10)"
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 300s # first boot runs Django migrations

networks:
  edge:
    name: edge
    external: true

volumes:
  taiga-media:
    name: taiga_media
