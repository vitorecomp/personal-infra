map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080 default_server;
    server_name _;

    large_client_header_buffers 4 32k;
    client_max_body_size 100M;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Frontend SPA (taiga-front)
    location / {
        root /taiga-front;
        try_files $uri $uri/ /index.html;
    }

    # Ensure runtime conf.json is never cached stale by browsers/CDN
    location = /conf.json {
        root /taiga-front;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Backend REST API & Django Admin (taiga-back Gunicorn on 127.0.0.1:8000)
    location /api {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8000/api;
        proxy_redirect off;
    }

    location /admin {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8000/admin;
        proxy_redirect off;
    }

    # Django static assets (collected at build time)
    location /static/ {
        alias /taiga-back/static/;
        expires 7d;
        access_log off;
    }

    # User-uploaded media & attachments (persisted via GCS FUSE at /mnt/taiga-storage/media)
    location /media/ {
        alias /taiga-back/media/;
        expires 1d;
    }

    location /_protected/ {
        alias /taiga-back/media/;
        expires 1d;
    }
}
