# Ghost 5 blog stack for the GCP VM (blog.vitorx86.dev).
#
# TLS and ports are handled by the shared edge stack (cloud/edge); Ghost joins the `edge`
# network as `blog-ghost`. MySQL runs locally on a private network, tuned for the e2-micro
# (1 GB RAM). The Ghost image is built from github.com/vitorecomp/personal-blog on the GitHub
# runner (deploy-blog.yml), pushed to GHCR and pinned by digest in GHOST_IMAGE; the VM only
# pulls it. `.env` (mode 0600) holds the secrets; CI only writes GHOST_IMAGE into it.
#
# Rules: every volume has an explicit name; never run `docker compose down -v`.
name: personal-blog

services:
  ghost:
    image: ${GHOST_IMAGE:?set GHOST_IMAGE in .env (deploy-blog.yml writes it)}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      url: https://${STACK_DOMAIN:-blog.vitorx86.dev}
      database__client: mysql
      database__connection__host: db
      database__connection__port: "3306"
      database__connection__user: ghost
      database__connection__password: ${GHOST_DB_PASSWORD:?set GHOST_DB_PASSWORD in .env}
      database__connection__database: ghost
      database__pool__min: "0"
      database__pool__max: "4"
      security__staffDeviceVerification: "false"
      # Keep Node's heap small on the shared 1 GB VM.
      NODE_OPTIONS: --max-old-space-size=${GHOST_MAX_HEAP_MB:-256}
    volumes:
      - ghost-content:/var/lib/ghost/content
    networks:
      default:
      edge:
        aliases: [blog-ghost]
    healthcheck:
      # Ghost redirects plain-HTTP requests to its https url unless told the proxy terminated TLS.
      test: ["CMD-SHELL", "wget -qO- --header 'X-Forwarded-Proto: https' http://127.0.0.1:2368/ghost/api/admin/site/ >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 180s

  db:
    image: mysql:8.0.46
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=8M
      - --performance-schema=OFF
      - --disable-log-bin
      - --max-connections=30
      - --table-open-cache=200
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${GHOST_DB_PASSWORD:?set GHOST_DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 60s

networks:
  edge:
    name: edge
    external: true

volumes:
  ghost-content:
    name: personal-blog_ghost-content
  mysql-data:
    name: personal-blog_mysql-data
