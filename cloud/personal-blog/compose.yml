# Ghost 5 blog stack for the Oracle Cloud A1 VM (blog.vitorx86.dev).
#
# Deployed by cloud/scripts/deploy_stack.py into /opt/stacks/personal-blog, where
# `app/` is a checkout of github.com/vitorecomp/personal-blog (Ghost + theme image)
# and `.env` (mode 0600, never written by CI) holds the secrets listed in .env.example.
#
# Rules: only Caddy publishes ports; every volume has an explicit name so data
# survives project renames; never run `docker compose down -v`.
name: personal-blog

services:
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      STACK_DOMAIN: ${STACK_DOMAIN:-blog.vitorx86.dev}
      ACME_EMAIL: ${ACME_EMAIL:-vitor.ecomp@gmail.com}
      # Email => Let's Encrypt; "internal" => local CA for pre-cutover rehearsals.
      CADDY_TLS: ${CADDY_TLS:-vitor.ecomp@gmail.com}
      UPSTREAM: ghost:2368
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      ghost:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  ghost:
    build:
      context: ./app
      args:
        GHOST_VERSION: ${GHOST_VERSION:-5.130.6}
    image: personal-blog-ghost:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      url: https://${STACK_DOMAIN:-blog.vitorx86.dev}
      database__client: mysql
      database__connection__host: db
      database__connection__port: "3306"
      database__connection__user: ghost
      database__connection__password: ${GHOST_DB_PASSWORD:?set GHOST_DB_PASSWORD in .env}
      database__connection__database: ghost
      security__staffDeviceVerification: "false"
      # GHOST_STORAGE_SYNC_DIR is intentionally unset: content lives on the volume below.
    volumes:
      - ghost-content:/var/lib/ghost/content
    healthcheck:
      # Ghost redirects plain-HTTP requests to its https url unless told the proxy terminated TLS.
      test: ["CMD-SHELL", "wget -qO- --header 'X-Forwarded-Proto: https' http://127.0.0.1:2368/ghost/api/admin/site/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  db:
    image: mysql:8.0.46
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --disable-log-bin
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${GHOST_DB_PASSWORD:?set GHOST_DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  caddy-data:
    name: personal-blog_caddy-data
  caddy-config:
    name: personal-blog_caddy-config
  ghost-content:
    name: personal-blog_ghost-content
  mysql-data:
    name: personal-blog_mysql-data
