# Shared TLS edge for every stack on the GCP VM (static IP: terraform output public_ip in envs/gcp-taiga).
#
# One Caddy owns ports 80/443 and routes each hostname to its app container over the
# `edge` docker network (app stacks join it as an external network with a fixed alias).
# Deployed by cloud/scripts/deploy_stack.py --stack edge; `.env` holds hostnames, upstream, and TLS modes.
name: edge

services:
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      TAIGA_DOMAIN: ${TAIGA_DOMAIN:?set TAIGA_DOMAIN in .env}
      BLOG_DOMAIN: ${BLOG_DOMAIN:?set BLOG_DOMAIN in .env}
      # Per site: the ACME email => Let's Encrypt; "internal" => local CA while DNS points elsewhere.
      TAIGA_TLS: ${TAIGA_TLS:-${ACME_EMAIL}}
      BLOG_TLS: ${BLOG_TLS:-${ACME_EMAIL}}
      # Taiga's Cloud Run URL (terraform -chdir=cloud/infra/envs/gcp-taiga output taiga_run_url).
      TAIGA_UPSTREAM: ${TAIGA_UPSTREAM:?set TAIGA_UPSTREAM in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge:
    name: edge
    external: true # created by deploy_stack.py (shared with every app stack)

volumes:
  caddy-data:
    name: edge_caddy-data
  caddy-config:
    name: edge_caddy-config
