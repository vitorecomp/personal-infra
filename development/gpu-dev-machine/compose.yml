# Podman Compose stack for the GPU development machine (`dev-gpu-vm`).
#
# Run with:
#   cp .env.example .env && chmod 600 .env
#   podman-compose -f compose.yml up -d --build

name: gpu-dev-machine

services:
  vllm-server:
    # vLLM's own OpenAI-compatible server (the image's ENTRYPOINT is `vllm serve`). DeepSeek-V4.1-Flash needs
    # vLLM >= 0.30 (v0.30.0 release notes) and every released Ray Serve LLM (latest 2.60.1) pins vLLM 0.29,
    # so the stack does not use Ray. All model, tensor-parallel, CPU-offload and KV-cache settings are the
    # arguments under `command:` (flags verified against vLLM v0.34.0's arg_utils.py, cli_args.py and parser registries).
    # v0.34.0 is required on these RTX PRO 6000 (SM120) GPUs: v0.33.0 used 128-token KV blocks for the DeepSeek-V4.1
    # indexer, which trips DeepGEMM's `block_kv == 32 or block_kv == 64` assert during CUDA graph capture (#59203).
    image: docker.io/vllm/vllm-openai:v0.34.0
    container_name: vllm-server
    restart: unless-stopped
    ipc: host
    shm_size: "64gb"
    security_opt:
      - label=disable
    ulimits:
      memlock: -1
      stack: 67108864
    devices:
      - nvidia.com/gpu=all
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /mnt/data/huggingface
      VLLM_ENGINE_READY_TIMEOUT_S: "7200" # loading the 475 GiB checkpoint takes long
      # Rust thread pools (HF tokenizers) default to one thread per CPU in every worker process: 4 TP workers x 192
      # vCPUs blew through Podman's default 2048-task limit right after loading ("ThreadPoolBuildError ... Resource
      # temporarily unavailable"). Cap them; the deploy also raises Podman's pids_limit (containers.conf.d).
      RAYON_NUM_THREADS: "16"
      # Persist the JIT/compile caches (vLLM torch.compile, FlashInfer, TileLang, Triton, CuTe-DSL) on the data disk so
      # restarts skip recompilation; CuTe-DSL's default /tmp/<user> path could not even be created in the container.
      XDG_CACHE_HOME: /cache
      FLASHINFER_WORKSPACE_BASE: /cache
      TILELANG_CACHE_DIR: /cache/tilelang
      TRITON_CACHE_DIR: /cache/triton
      CUTE_DSL_CACHE_DIR: /cache/cute-dsl
    command:
      - deepseek-ai/DeepSeek-V4.1-Flash # full unquantized checkpoint (no --quantization)
      - --served-model-name=deepseek-ai/DeepSeek-V4.1-Flash
      - --host=0.0.0.0
      - --port=8000
      - --tensor-parallel-size=4
      - --cpu-offload-gb=48 # weights beyond VRAM live in host RAM
      - '--engram-config={"cpu_offload": true, "use_thp": true}'
      - --gpu-memory-utilization=0.92
      - --max-model-len=65536
      - --kv-cache-dtype=fp8
      - --max-num-seqs=8
      - --tokenizer-mode=deepseek_v41
      - --tool-call-parser=deepseek_v41
      - --enable-auto-tool-choice
      - --reasoning-parser=deepseek_v41
      - --trust-remote-code
    volumes:
      - ${HF_CACHE_DIR:-/mnt/data/huggingface}:/mnt/data/huggingface
      - ${VLLM_CACHE_DIR:-/mnt/data/vllm-cache}:/cache
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - gpu-dev-net
    healthcheck:
      # No curl in the vLLM image; /health answers once the engine is ready.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 1800s

  litellm:
    build:
      context: ./litellm
      dockerfile: Dockerfile
    image: localhost/gpu-dev-litellm:1.109.1
    container_name: litellm
    restart: unless-stopped
    depends_on:
      - vllm-server
    environment:
      VLLM_API_BASE: http://vllm-server:8000/v1
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - gpu-dev-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/health/liveliness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  deepseek-harness:
    build:
      context: ./deepseek-harness
      dockerfile: Dockerfile
    image: localhost/gpu-dev-deepseek-harness:0.2.2-rc.1
    container_name: deepseek-harness
    restart: unless-stopped
    depends_on:
      - litellm
    security_opt:
      - label=disable
    environment:
      DSH_HOME: /dsh-home
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      OPENAI_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
    volumes:
      - ${HARNESS_DATA_DIR:-/mnt/data/deepseek-harness/dsh-home}:/dsh-home
      - ${HARNESS_WORKSPACE_DIR:-/mnt/data/deepseek-harness/workspace}:/workspace
    ports:
      - "127.0.0.1:3080:3080"
    networks:
      - gpu-dev-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  litellm-tunnel:
    build:
      context: ./reverse-tunnel
      dockerfile: Dockerfile
    image: localhost/gpu-dev-reverse-tunnel:1.0.0
    container_name: litellm-tunnel
    restart: unless-stopped
    depends_on:
      - litellm
    security_opt:
      - label=disable
    environment:
      # Single-level only: podman-compose 1.0.x passes nested ${A:-${B}} defaults through literally.
      # deploy_gpu_stack.sh writes the resolved per-tunnel values (falling back to TUNNEL_SSH_*) into .env.
      TUNNEL_SSH_HOST: ${LITELLM_TUNNEL_SSH_HOST:-}
      TUNNEL_SSH_PORT: ${LITELLM_TUNNEL_SSH_PORT:-22}
      TUNNEL_SSH_USER: ${LITELLM_TUNNEL_SSH_USER:-}
      TUNNEL_BIND_ADDRESS: ${TUNNEL_BIND_ADDRESS:-127.0.0.1}
      REMOTE_PORT: ${REMOTE_LITELLM_PORT:-4000}
      TARGET_HOST: litellm
      TARGET_PORT: "4000"
    volumes:
      - ${TUNNEL_SSH_KEY_FILE:-/mnt/data/reverse-tunnel/id_ed25519}:/run/tunnel/ssh_key:ro
      - ${TUNNEL_KNOWN_HOSTS_FILE:-/mnt/data/reverse-tunnel/known_hosts}:/run/tunnel/known_hosts:ro
      - ${TUNNEL_STATE_DIR:-/mnt/data/reverse-tunnel/state}/litellm:/data
    networks:
      - gpu-dev-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x autossh >/dev/null && pgrep -x ssh >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  deepseek-harness-tunnel:
    build:
      context: ./reverse-tunnel
      dockerfile: Dockerfile
    image: localhost/gpu-dev-reverse-tunnel:1.0.0
    container_name: deepseek-harness-tunnel
    restart: unless-stopped
    depends_on:
      - deepseek-harness
    security_opt:
      - label=disable
    environment:
      # Single-level only: podman-compose 1.0.x passes nested ${A:-${B}} defaults through literally.
      # deploy_gpu_stack.sh writes the resolved per-tunnel values (falling back to TUNNEL_SSH_*) into .env.
      TUNNEL_SSH_HOST: ${HARNESS_TUNNEL_SSH_HOST:-}
      TUNNEL_SSH_PORT: ${HARNESS_TUNNEL_SSH_PORT:-22}
      TUNNEL_SSH_USER: ${HARNESS_TUNNEL_SSH_USER:-}
      TUNNEL_BIND_ADDRESS: ${TUNNEL_BIND_ADDRESS:-127.0.0.1}
      REMOTE_PORT: ${REMOTE_HARNESS_PORT:-3080}
      TARGET_HOST: deepseek-harness
      TARGET_PORT: "3080"
    volumes:
      - ${TUNNEL_SSH_KEY_FILE:-/mnt/data/reverse-tunnel/id_ed25519}:/run/tunnel/ssh_key:ro
      - ${TUNNEL_KNOWN_HOSTS_FILE:-/mnt/data/reverse-tunnel/known_hosts}:/run/tunnel/known_hosts:ro
      - ${TUNNEL_STATE_DIR:-/mnt/data/reverse-tunnel/state}/harness:/data
    networks:
      - gpu-dev-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x autossh >/dev/null && pgrep -x ssh >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  gpu-dev-net:
    name: gpu-dev-net
    driver: bridge
