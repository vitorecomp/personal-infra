name: Terraform Cloud Infrastructure
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply after plan"
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "cloud/infra/**"
      - ".github/workflows/terraform-cloud.yml"
  push:
    branches: [ "main", "master" ]
    paths:
      - "cloud/infra/**"
      - ".github/workflows/terraform-cloud.yml"

concurrency:
  group: terraform-cloud-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Plan & Apply (prod)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/infra/envs/prod
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID || 'compute-bench' }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
      TF_VAR_bucket_name: ${{ vars.GCS_BUCKET_NAME || 'main-website-compute-bench' }}
      TF_VAR_domain: ${{ vars.NOBUFFER_DOMAINS || '["www.vitorx86.dev","vitorx86.dev"]' }}
      TF_VAR_portfolio_bucket_name: ${{ vars.GCS_PORTFOLIO_BUCKET_NAME || 'portfolio-website-compute-bench' }}
      TF_VAR_portfolio_domain: ${{ vars.PORTFOLIO_DOMAINS || '["cases.vitorx86.dev","me.vitorx86.dev"]' }}
      TF_VAR_blog_domain: ${{ vars.BLOG_DOMAINS || '["blog.vitorx86.dev"]' }}
      TF_VAR_blog_service_name: ${{ vars.CLOUD_RUN_BLOG_SERVICE || 'personal-blog' }}
      TF_VAR_blog_ar_repo_name: ${{ vars.GAR_BLOG_REPO || 'personal-blog' }}
      TF_VAR_blog_content_bucket_name: ${{ vars.GCS_BLOG_CONTENT_BUCKET_NAME || 'blog-content-compute-bench' }}
      TF_VAR_blog_db_instance_name: ${{ vars.BLOG_DB_INSTANCE_NAME || 'personal-blog-mysql' }}
      TF_VAR_blog_db_tier: ${{ vars.BLOG_DB_TIER || 'db-f1-micro' }}
      TF_VAR_blog_db_name: ${{ vars.BLOG_DB_NAME || 'ghost' }}
      TF_VAR_blog_db_user: ${{ vars.BLOG_DB_USER || 'ghost' }}
      TF_VAR_blog_db_password: ${{ secrets.BLOG_DB_PASSWORD || '' }}
      TF_VAR_taiga_domain: ${{ vars.TAIGA_DOMAINS || '["taiga.vitorx86.dev"]' }}
      TF_VAR_taiga_service_name: ${{ vars.CLOUD_RUN_TAIGA_SERVICE || 'taiga' }}
      TF_VAR_taiga_ar_repo_name: ${{ vars.GAR_TAIGA_REPO || 'taiga' }}
      TF_VAR_taiga_content_bucket_name: ${{ vars.GCS_TAIGA_CONTENT_BUCKET_NAME || 'taiga-content-compute-bench' }}
      TF_VAR_taiga_db_instance_name: ${{ vars.TAIGA_DB_INSTANCE_NAME || 'taiga-postgres' }}
      TF_VAR_taiga_db_tier: ${{ vars.TAIGA_DB_TIER || 'db-f1-micro' }}
      TF_VAR_taiga_db_name: ${{ vars.TAIGA_DB_NAME || 'taiga' }}
      TF_VAR_taiga_db_user: ${{ vars.TAIGA_DB_USER || 'taiga' }}
      TF_VAR_taiga_db_password: ${{ secrets.TAIGA_DB_PASSWORD || '' }}
      TF_VAR_taiga_secret_key: ${{ secrets.TAIGA_SECRET_KEY || '' }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Terraform Init
      run: terraform init

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      run: terraform plan -input=false -out=tfplan

    - name: Terraform Apply
      if: >-
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
        (github.event_name == 'workflow_dispatch' && inputs.apply == true)
      run: terraform apply -input=false -auto-approve tfplan
