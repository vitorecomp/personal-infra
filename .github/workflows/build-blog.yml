name: Build and Deploy the Personal Blog
on:
  workflow_dispatch:
  repository_dispatch:
    types: [ "deploy-personal-blog" ]
  push:
    branches: [ "main", "master" ]
    paths:
      - "cloud/personal-blog/cloudbuild.yaml"
      - "cloud/scripts/download_personal_blog.py"
      - "cloud/scripts/seed_ghost_admin.py"
      - ".github/workflows/build-blog.yml"

concurrency:
  group: build-blog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'compute-bench' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      GAR_BLOG_REPO: ${{ vars.GAR_BLOG_REPO || 'personal-blog' }}
      CLOUD_RUN_BLOG_SERVICE: ${{ vars.CLOUD_RUN_BLOG_SERVICE || 'personal-blog' }}
      BLOG_URL: ${{ vars.BLOG_URL || 'https://blog.vitorx86.dev' }}
    steps:
    - uses: actions/checkout@v7

    - name: Download personal-blog repository
      run: |
        python3 cloud/scripts/download_personal_blog.py --https

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Submit Build to Cloud Build
      run: |
        gcloud builds submit cloud/personal-blog/repo \
          --project "${GCP_PROJECT_ID}" \
          --config cloud/personal-blog/cloudbuild.yaml \
          --substitutions=_REGION=${GCP_REGION},_AR_REPO=${GAR_BLOG_REPO},_SERVICE_NAME=${CLOUD_RUN_BLOG_SERVICE}

    - name: Deploy Container to Cloud Run
      run: |
        gcloud run services update "${CLOUD_RUN_BLOG_SERVICE}" \
          --project "${GCP_PROJECT_ID}" \
          --region "${GCP_REGION}" \
          --image "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_BLOG_REPO}/${CLOUD_RUN_BLOG_SERVICE}:latest" \
          --update-env-vars "NODE_ENV=production,url=${BLOG_URL},security__staffDeviceVerification=false" \
          --no-invoker-iam-check \
          --quiet

    - name: Seed Ghost Admin Owner
      env:
        BLOG_ADMIN_EMAIL: ${{ vars.BLOG_ADMIN_EMAIL || 'vitor.ecomp@gmail.com' }}
        BLOG_ADMIN_PASSWORD: ${{ secrets.BLOG_ADMIN_PASSWORD }}
      run: |
        python3 cloud/scripts/seed_ghost_admin.py --blog-url "${BLOG_URL}"
