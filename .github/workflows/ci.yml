name: CI Validation
on:
  workflow_dispatch:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan Repository & History for Secrets
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Run secret scanner self-test & full history audit
      run: |
        python3 workspace/scripts/scan_repo_secrets.py --self-test
        python3 workspace/scripts/scan_repo_secrets.py --history

  python-checks:
    name: Validate Python Scripts & Dry-Runs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Syntax check Python scripts
      run: |
        python3 -m py_compile workspace/scripts/*.py cloud/scripts/*.py .agents/skills/taiga/scripts/*.py

    - name: Verify workspace sync dry-run
      run: |
        python3 workspace/scripts/sync_workspace_repos.py --dry-run
        python3 workspace/scripts/validate_repos_pushed.py --dry-run
        python3 workspace/scripts/scan_repo_secrets.py --install-hook --dry-run
        python3 workspace/scripts/enroll_taiga_projects.py --dry-run
        python3 workspace/scripts/taiga_cli.py projects create --name ci-test --dry-run

    - name: Verify cloud download & deploy scripts dry-run
      run: |
        python3 cloud/scripts/download_personal_blog.py --deploy --dry-run
        python3 cloud/scripts/deploy_taiga.py --deploy --dry-run
        BLOG_ADMIN_EMAIL=ci@example.com BLOG_ADMIN_PASSWORD=ci-pass python3 cloud/scripts/seed_ghost_admin.py --dry-run
        TAIGA_ADMIN_EMAIL=ci@example.com TAIGA_ADMIN_PASSWORD=ci-pass python3 cloud/scripts/seed_taiga_admin.py --dry-run
        python3 cloud/scripts/configure_ai_spend_cap.py compute-bench --billing-account 000000-000000-000000 --project-number 1234567890 --amount 1200 --services all --dry-run

    - name: Verify VM stack scripts dry-run
      run: |
        python3 cloud/scripts/bootstrap_vm.py --host ci@example.invalid --provider oracle --deploy-pubkey "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleOnly ci" --backup-stack personal-blog --dry-run
        python3 cloud/scripts/bootstrap_vm.py --host ci@example.invalid --provider gce --deploy-pubkey "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleOnly ci" --swap-gb 3 --backup-stack taiga --dry-run
        python3 cloud/scripts/deploy_stack.py --stack personal-blog --host deploy@example.invalid --dry-run
        python3 cloud/scripts/deploy_stack.py --stack taiga --host deploy@example.invalid --dry-run
        python3 cloud/scripts/deploy_stack.py --stack edge --host deploy@example.invalid --dry-run
        TAIGA_DB_HOST=db.example TAIGA_DB_NAME=taiga TAIGA_DB_USER=ci TAIGA_DB_PASSWORD=ci python3 cloud/scripts/deploy_stack.py --stack taiga --host deploy@example.invalid --sync-env TAIGA_DB_HOST,TAIGA_DB_NAME,TAIGA_DB_USER,TAIGA_DB_PASSWORD --dry-run
        python3 cloud/scripts/backup_stack.py --stack-dir cloud/personal-blog --dry-run
        python3 cloud/scripts/backup_stack.py --stack-dir cloud/taiga --restore-test --dry-run
        python3 cloud/scripts/migrate_gcp_data.py archive --stack taiga --dry-run
        python3 cloud/scripts/migrate_gcp_data.py all --stack personal-blog --host deploy@example.invalid --confirm-overwrite --dry-run
        python3 cloud/scripts/migrate_gcp_data.py copy-secrets --stack taiga --host deploy@example.invalid --dry-run
        python3 cloud/scripts/migrate_gcp_data.py import --stack personal-blog --host deploy@example.invalid --local-export /tmp/ci-export --confirm-overwrite --dry-run
        python3 cloud/scripts/migrate_gcp_data.py verify --stack personal-blog --host deploy@example.invalid --offline --dry-run
        python3 cloud/scripts/migrate_gcp_data.py export --stack taiga --host deploy@example.invalid --upload-to gs://ci-bucket/migration --dry-run
        bash -n cloud/scripts/tf_apply_retry.sh && cloud/scripts/tf_apply_retry.sh --env oci-blog --dry-run
        BLOG_ADMIN_EMAIL=ci@example.com BLOG_ADMIN_PASSWORD=ci-pass python3 cloud/scripts/seed_ghost_admin.py --connect-ip 192.0.2.10 --insecure --dry-run

  terraform-validate:
    name: Validate Terraform (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [ "prod", "gcp-taiga", "oci-blog" ]
    steps:
    - uses: actions/checkout@v7

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: "1.17.1"

    - name: Terraform format check
      run: |
        terraform fmt -check -recursive cloud/infra

    # Validation only: no plan/apply ever runs in CI. VM roots are applied by hand
    # (documentation/vm-provisioning.md); prod is legacy until it is destroyed.
    - name: Terraform init & validate
      working-directory: cloud/infra/envs/${{ matrix.env }}
      run: |
        terraform init -backend=false -input=false
        terraform validate

  stack-validate:
    name: Validate compose stacks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [ "edge", "personal-blog", "taiga" ]
    steps:
    - uses: actions/checkout@v7

    - name: Validate stack.json and required files
      run: |
        python3 - <<'PY'
        import json, pathlib, sys
        stack = pathlib.Path("cloud/${{ matrix.stack }}")
        meta = json.loads((stack / "stack.json").read_text())
        missing = [f for f in meta["required_files"] if not (stack / f).exists()]
        if missing:
            sys.exit(f"missing required files: {missing}")
        print(f"stack.json ok: {meta['name']} -> {meta['domain']}")
        PY

    - name: docker compose config
      working-directory: cloud/${{ matrix.stack }}
      run: |
        if [ -f compose.yml ]; then docker compose -f compose.yml --env-file .env.example config -q; else echo "no compose.yml (stack deploys via its up_script)"; fi

    - name: shell scripts syntax
      working-directory: cloud/${{ matrix.stack }}
      run: |
        for f in *.sh; do [ -e "$f" ] || continue; bash -n "$f" && echo "ok $f"; done

    - name: caddy validate
      if: matrix.stack == 'edge'
      working-directory: cloud/${{ matrix.stack }}
      run: |
        for tls in internal ci@example.com; do
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e ACME_EMAIL=ci@example.com -e TAIGA_TLS="$tls" -e BLOG_TLS="$tls" \
            caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
        done
