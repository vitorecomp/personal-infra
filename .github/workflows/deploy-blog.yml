name: Deploy the Personal Blog (GCP VM)
# 1. build: builds the Ghost image from vitorecomp/personal-blog on the GitHub runner (theme check
#    included) and pushes it to GHCR, so the e2-micro VM never builds anything.
# 2. deploy: over SSH, refreshes the shared edge proxy, writes the digest-pinned GHOST_IMAGE into the
#    VM .env, pulls it (throwaway login with this job's GITHUB_TOKEN) and restarts Ghost.
# Secrets/variables live in the GitHub Environment "blog-prod" (see documentation/pipeline-setup.md).
on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "vitorecomp/personal-blog ref/SHA to build (default: main)"
        required: false
        default: ""
  repository_dispatch:
    types: [ "deploy-personal-blog" ]
  push:
    branches: [ "main" ]
    paths:
      - "cloud/personal-blog/**"
      - "cloud/edge/**"
      - "cloud/scripts/deploy_stack.py"
      - "cloud/scripts/backup_stack.py"
      - "cloud/scripts/seed_ghost_admin.py"
      - ".github/workflows/deploy-blog.yml"

concurrency:
  group: deploy-gcp-vm # both app workflows (and the shared edge stack) target the same VM
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: personal-blog

jobs:
  build:
    name: Build the Ghost image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
    - name: Validate the requested ref
      id: ref
      env:
        # Untrusted inputs go through env (never inline in run:).
        APP_REF: ${{ github.event.client_payload.sha || inputs.app_ref || 'main' }}
      run: |
        set -euo pipefail
        if [[ ! "$APP_REF" =~ ^[A-Za-z0-9._/-]{1,100}$ || "$APP_REF" == *..* || "$APP_REF" == -* ]]; then
          echo "::error::Refusing suspicious app ref"; exit 1
        fi
        echo "ref=$APP_REF" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v7
      with:
        repository: vitorecomp/personal-blog
        ref: ${{ steps.ref.outputs.ref }}
        path: app
        persist-credentials: false

    - name: Validate the theme
      run: docker run --rm -v "$PWD/app:/src:ro" -w /src node:24.22.3-alpine node scripts/validate-theme.mjs

    - name: Build and push
      id: push
      env:
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        sha="$(git -C app rev-parse HEAD)"
        repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
        printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
        BUILDX_NO_DEFAULT_ATTESTATIONS=1 docker build --pull -q \
          --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
          --label "org.opencontainers.image.revision=${sha}" \
          --label "org.opencontainers.image.description=Ghost + vitorx86-garage theme (vitorecomp/personal-blog)" \
          -t "${repo}:${sha}" -t "${repo}:latest" app >/dev/null
        docker push -q "${repo}:${sha}" >/dev/null
        docker push -q "${repo}:latest" >/dev/null
        image="$(docker inspect --format '{{index .RepoDigests 0}}' "${repo}:${sha}")"
        echo "Built personal-blog@${sha} -> ${image}"
        echo "image=${image}" >> "$GITHUB_OUTPUT"
        docker logout ghcr.io >/dev/null

  deploy:
    name: Deploy personal-blog over SSH
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: blog-prod
      url: https://blog.vitorx86.dev
    permissions:
      contents: read
      packages: read # the VM pulls the image with this job's short-lived GITHUB_TOKEN
    steps:
    - uses: actions/checkout@v7

    - name: Load deploy key and pin the host key
      env:
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      run: |
        set -euo pipefail
        test -n "$DEPLOY_SSH_KEY" || { echo "::error::DEPLOY_SSH_KEY is not set in environment blog-prod"; exit 1; }
        test -n "$DEPLOY_KNOWN_HOSTS" || { echo "::error::DEPLOY_KNOWN_HOSTS is not set in environment blog-prod"; exit 1; }
        install -d -m 700 ~/.ssh
        printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts
        eval "$(ssh-agent -s)"
        printf '%s\n' "$DEPLOY_SSH_KEY" | ssh-add - >/dev/null
        echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
        echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

    - name: Deploy
      env:
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
        GHOST_IMAGE: ${{ needs.build.outputs.image }}
        REGISTRY_USER: ${{ github.actor }}
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BLOG_ADMIN_EMAIL: ${{ vars.BLOG_ADMIN_EMAIL }}
        BLOG_ADMIN_PASSWORD: ${{ secrets.BLOG_ADMIN_PASSWORD }}
      run: |
        python3 cloud/scripts/deploy_stack.py --stack edge
        python3 cloud/scripts/deploy_stack.py --stack personal-blog --sync-env GHOST_IMAGE

    - name: Stop ssh-agent
      if: always()
      run: ssh-agent -k >/dev/null 2>&1 || true
